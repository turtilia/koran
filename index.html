<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Изучение Священного Корана</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1b12 0%, #1a3c27 100%);
      color: #f4f4f4;
      padding: 20px;
    }
    .header-box {
      text-align: center;
      margin-bottom: 35px;
    }
    .bismillah {
      font-family: 'Amiri', serif;
      font-size: 28px;
      color: #d4af37;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 14px;
      color: #a3c1ad;
      margin-top: 6px;
    }
    .cards-container {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 750px;
    }
    .card {
      background: #ffffff;
      padding: 20px 15px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 125px;
      border-top: 4px solid #d4af37;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 12px;
      text-align: center;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .value-input {
      width: 100%;
      font-size: 28px;
      font-weight: 700;
      color: #1a3c27;
      margin: 10px 0;
      text-align: center;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: #f8f9fa;
      padding: 4px 0;
      outline: none;
      transition: border-color 0.2s;
    }
    .value-input:focus {
      border-color: #1a3c27;
      background: #ffffff;
    }
    .value-input::-webkit-outer-spin-button,
    .value-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .btn {
      width: 100%;
      padding: 10px 0;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #1a3c27;
      color: #d4af37;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .btn:hover {
      background-color: #265538;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .btn-down {
      background-color: #f8f9fa;
      color: #8c2626;
      border: 1px solid #e2e8f0;
    }
    .btn-down:hover {
      background-color: #edf2f7;
    }
    .status {
      margin-top: 35px;
      font-size: 13px;
      color: #a3c1ad;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="header-box">
    <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <h1>Успехи в изучении Корана</h1>
    <div class="subtitle">Ежедневный учет достижений</div>
  </div>

  <div class="cards-container" id="controls"></div>

  <div class="status" id="status">Загрузка данных из таблицы...</div>

  <script>
    const FIELD_NAMES = [
      "Выучено сур",
      "Страниц",
      "Повторений",
      "Джузов",
      "Баллы / Дни"
    ];

    let numbers = [0, 0, 0, 0, 0];

    // ВСТАВЬ СЮДА СКОПИРОВАННУЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRJnx4x7t_9JtG8JsdDxkoBmNzg76VHOqP6tk2EBl7aqMxJEVQ-UJ-Rhml-ukoVaT6/exec";

    // Загрузка данных из Google Таблицы при открытии сайта
    async function loadData() {
      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();
        if (result.status === "success") {
          numbers = result.values.map(Number);
          render();
          document.getElementById('status').innerText = "✓ Данные загружены из таблицы";
        }
      } catch (err) {
        document.getElementById('status').innerText = "⚠️ Ошибка загрузки из таблицы";
        console.error(err);
        render(); // Показываем нули, если нет интернета
      }
    }

    // Сохранение данных в Google Таблицу при изменении
    async function saveData() {
      document.getElementById('status').innerText = "Сохранение в таблицу...";
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors", // Важно для обхода блокировок браузера при отправке в Google
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ values: numbers })
        });
        document.getElementById('status').innerText = "✓ Сохранено в таблицу";
      } catch (err) {
        document.getElementById('status').innerText = "⚠️ Ошибка сохранения";
        console.error(err);
      }
    }

    // Изменение кнопками (+1 или -1)
    function changeValue(index, delta) {
      numbers[index] = Math.max(0, numbers[index] + delta);
      
      const inputEl = document.getElementById(`input-${index}`);
      if (inputEl) {
        inputEl.value = numbers[index];
      }
      
      saveData();
    }

    // Обновление при вводе цифры вручную
    function handleInput(index, value) {
      let parsed = parseInt(value);
      if (isNaN(parsed) || parsed < 0) {
        parsed = 0;
      }
      numbers[index] = parsed;
      saveData();
    }

    function render() {
      const container = document.getElementById('controls');
      container.innerHTML = '';

      numbers.forEach((val, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">${FIELD_NAMES[index]}</div>
          <button class="btn" onclick="changeValue(${index}, 1)" title="Увеличить">▲</button>
          <input type="number" id="input-${index}" class="value-input" value="${val}" min="0" oninput="handleInput(${index}, this.value)">
          <button class="btn btn-down" onclick="changeValue(${index}, -1)" title="Уменьшить">▼</button>
        `;
        container.appendChild(card);
      });
    }

    // Запускаем загрузку при старте страницы
    loadData();
  </script>
</body>
</html>
