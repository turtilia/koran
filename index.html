<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Изучение Священного Корана</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%231a3c27%22/><text y=%22.9em%22 x=%22.22em%22 font-size=%2275%22 font-family=%22Georgia, serif%22 font-weight=%22bold%22 fill=%22%23d4af37%22>Q</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%231a3c27%22/><text y=%22.9em%22 x=%22.22em%22 font-size=%2275%22 font-family=%22Georgia, serif%22 font-weight=%22bold%22 fill=%22%23d4af37%22>Q</text></svg>">

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1b12 0%, #1a3c27 100%);
      color: #f4f4f4;
      padding: 30px 20px;
    }
    .header-box {
      text-align: center;
      margin-bottom: 25px;
    }
    .bismillah {
      font-family: 'Amiri', serif;
      font-size: 28px;
      color: #d4af37;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
    }
    .subtitle {
      font-size: 14px;
      color: #a3c1ad;
      margin-top: 4px;
    }
    .cards-container {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 600px;
      margin-bottom: 30px;
    }
    .card {
      background: #ffffff;
      padding: 20px 15px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 130px;
      border-top: 4px solid #d4af37;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 12px;
      text-align: center;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .value-input {
      width: 100%;
      font-size: 28px;
      font-weight: 700;
      color: #1a3c27;
      margin: 10px 0;
      text-align: center;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: #f8f9fa;
      padding: 4px 0;
      outline: none;
      transition: border-color 0.2s;
    }
    .value-input:focus {
      border-color: #1a3c27;
      background: #ffffff;
    }
    .value-input::-webkit-outer-spin-button,
    .value-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .btn {
      width: 100%;
      padding: 10px 0;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #1a3c27;
      color: #d4af37;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .btn:hover {
      background-color: #265538;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .btn-down {
      background-color: #f8f9fa;
      color: #8c2626;
      border: 1px solid #e2e8f0;
    }
    .btn-down:hover {
      background-color: #edf2f7;
    }
    
    /* Стили для журнала изменений */
    .log-container {
      width: 100%;
      max-width: 570px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .log-title {
      font-size: 16px;
      font-weight: 600;
      color: #d4af37;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .log-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 5px;
    }
    .log-list::-webkit-scrollbar {
      width: 6px;
    }
    .log-list::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.5);
      border-radius: 4px;
    }
    .log-item {
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #e2e8f0;
      border-left: 3px solid #d4af37;
    }
    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #a3c1ad;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header-box">
    <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <h1>Успехи в изучении Корана</h1>
    <div class="subtitle">Ежедневный учет достижений</div>
  </div>

  <div class="cards-container" id="controls"></div>

  <!-- Блок журнала -->
  <div class="log-container">
    <div class="log-title">📖 Журнал достижений</div>
    <ul class="log-list" id="logList">
      <li class="log-item">Загрузка истории...</li>
    </ul>
  </div>

  <div class="status" id="status">Готово к работе</div>

  <script>
    const FIELD_NAMES = ["Страницы", "Тахаджуд", "Зикры", "Каза"];
    let numbers = [0, 0, 0, 0];
    let historyLogs = [];

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwYhk6BszCwMtmDhB4CZZJ_wO9gfrjVdMATkJWSE-OM5C4K_vuIZmIJ5pGn0SyYpSpT/exec";
    let saveTimeout = null;

    render();
    loadData();

    async function loadData() {
      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();
        if (result.status === "success") {
          numbers = result.values.map(v => (v === "" || v === null ? 0 : Number(v)));
          if (result.history) {
            historyLogs = result.history;
          }
          render();
          document.getElementById('status').innerText = "✓ Синхронизировано с таблицей";
        }
      } catch (err) {
        console.log("Автономный режим");
      }
    }

    function syncToSheet(logText = null) {
      document.getElementById('status').innerText = "Сохранение...";
      
      const payload = { values: numbers };
      if (logText) {
        payload.logEntry = logText;
        historyLogs.unshift(logText); // Добавляем наверх локально
        renderLog();
      }

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(() => {
        document.getElementById('status').innerText = "✓ Сохранено в таблицу";
      }).catch(err => {
        document.getElementById('status').innerText = "⚠️ Ошибка отправки";
      });
    }

    function getFormattedDate() {
      const now = new Date();
      const options = { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' };
      return now.toLocaleDateString('ru-RU', options);
    }

    function changeValue(index, delta) {
      numbers[index] = Math.max(0, numbers[index] + delta);
      
      const inputEl = document.getElementById(`input-${index}`);
      if (inputEl) inputEl.value = numbers[index];

      const sign = delta > 0 ? `+${delta}` : delta;
      const logText = `${getFormattedDate()}: ${FIELD_NAMES[index]} ${sign}`;

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => syncToSheet(logText), 1000);
    }

    function handleInput(index, value) {
      let parsed = parseInt(value);
      if (isNaN(parsed) || parsed < 0) parsed = 0;
      
      const diff = parsed - numbers[index];
      if (diff === 0) return;

      numbers[index] = parsed;
      const sign = diff > 0 ? `+${diff}` : diff;
      const logText = `${getFormattedDate()}: ${FIELD_NAMES[index]} установленое (${sign >= 0 ? '+' + sign : sign})`;

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => syncToSheet(logText), 1000);
    }

    function renderLog() {
      const logList = document.getElementById('logList');
      if (historyLogs.length === 0) {
        logList.innerHTML = `<li class="log-item">Пока нет записей. Начните изменять цифры!</li>`;
        return;
      }
      logList.innerHTML = historyLogs.map(item => `<li class="log-item">${item}</li>`).join('');
    }

    function render() {
      const container = document.getElementById('controls');
      container.innerHTML = '';

      numbers.forEach((val, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">${FIELD_NAMES[index]}</div>
          <button class="btn" onclick="changeValue(${index}, 1)" title="Увеличить">▲</button>
          <input type="number" id="input-${index}" class="value-input" value="${val}" min="0" oninput="handleInput(${index}, this.value)">
          <button class="btn btn-down" onclick="changeValue(${index}, -1)" title="Уменьшить">▼</button>
        `;
        container.appendChild(card);
      });

      renderLog();
    }
  </script>
</body>
</html>
